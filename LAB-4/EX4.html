<!DOCTYPE html>
<html>
<head>
    <title>AJAX Weather Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7f0000, #e53935);
        }

        .card {
            background: #ffffff;
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #b71c1c;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ffcdd2;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #e53935;
            box-shadow: 0 0 8px rgba(229,57,53,0.4);
        }

        button {
            padding: 14px 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(90deg, #d32f2f, #f44336);
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #b71c1c, #d32f2f);
            transform: translateY(-2px);
        }

        #spinner {
            margin-top: 15px;
            display: none;
            font-weight: bold;
            color: #d32f2f;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 15px;
            background: #ffebee;
            min-height: 90px;
            transition: 0.3s;
        }

        #result h3 {
            margin-bottom: 10px;
            color: #b71c1c;
        }

        #result p {
            margin: 6px 0;
        }

        .error {
            color: #b71c1c;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="card">
    <h2>🔴 Weather Dashboard</h2>

    <div class="input-group">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <div id="spinner">Fetching weather data...</div>
    <div id="result"></div>
</div>

<script>
    let lastSearchedCity = "";
    let cachedData = null;

    function getWeather() {

        const city = document.getElementById("cityInput").value.trim();
        const resultDiv = document.getElementById("result");
        const spinner = document.getElementById("spinner");

        if (city === "") {
            resultDiv.innerHTML = "<p class='error'>Please enter a city name.</p>";
            return;
        }

        if (city.toLowerCase() === lastSearchedCity.toLowerCase() && cachedData) {
            displayWeather(cachedData);
            return;
        }

        spinner.style.display = "block";
        resultDiv.innerHTML = "";

        const apiKey = "43bfd525f7af1ba9781a1aa14aef2556";
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

        const xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);

        xhr.onload = function () {

            spinner.style.display = "none";

            if (xhr.status === 200) {

                const data = JSON.parse(xhr.responseText);

                if (data.cod !== 200) {
                    resultDiv.innerHTML = "<p class='error'>City not found!</p>";
                    return;
                }

                lastSearchedCity = city;
                cachedData = data;

                displayWeather(data);

            } else {
                resultDiv.innerHTML = "<p class='error'>Error fetching data.</p>";
            }
        };

        xhr.onerror = function () {
            spinner.style.display = "none";
            resultDiv.innerHTML = "<p class='error'>Network error occurred.</p>";
        };

        xhr.send();
    }

    function displayWeather(data) {

        const resultDiv = document.getElementById("result");

        const temperature = data.main.temp;
        const humidity = data.main.humidity;
        const condition = data.weather[0].description;
        const cityName = data.name;
        const country = data.sys.country;

        resultDiv.innerHTML = `
            <h3>${cityName}, ${country}</h3>
            <p><strong>Temperature:</strong> ${temperature} °C</p>
            <p><strong>Humidity:</strong> ${humidity}%</p>
            <p><strong>Condition:</strong> ${condition}</p>
        `;
    }
</script>

</body>
</html>
