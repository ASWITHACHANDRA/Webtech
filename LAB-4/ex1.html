<!DOCTYPE html>
<html>
<head>
    <title>Username Availability Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7f0000, #e53935);
        }

        .card {
            background: #ffffff;
            width: 380px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 25px;
            color: #b71c1c;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ffcdd2;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #e53935;
            box-shadow: 0 0 8px rgba(229,57,53,0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(90deg, #d32f2f, #f44336);
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #b71c1c, #d32f2f);
            transform: translateY(-2px);
        }

        #feedback {
            margin-top: 18px;
            font-weight: bold;
            min-height: 24px;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }

        .loading {
            color: #d84315;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }

    </style>
</head>

<body>

<div class="card">
    <h2>🔴 Create Your Account</h2>

    <form id="registerForm">
        <div class="input-group">
            <input type="text" id="username" placeholder="Choose a username" required>
        </div>

        <button type="submit">Register Now</button>
    </form>

    <div id="feedback"></div>

    <div class="footer-text">
        Username will be checked automatically
    </div>
</div>

<script src="sernameAvailabilityChecker.js"></script>

</body>
</html>
