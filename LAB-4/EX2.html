<!DOCTYPE html>
<html>
<head>
    <title>AJAX Product Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7f0000, #e53935);
        }

        .container {
            background: white;
            width: 450px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #b71c1c;
        }

        .search-box {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ffcdd2;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #e53935;
            box-shadow: 0 0 8px rgba(229,57,53,0.4);
        }

        #message {
            font-weight: bold;
            margin-bottom: 10px;
            color: #c62828;
        }

        .product {
            background: #ffebee;
            border-left: 6px solid #d32f2f;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            text-align: left;
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .product h3 {
            margin-bottom: 5px;
            color: #b71c1c;
        }

        .product p {
            margin: 4px 0;
            font-size: 14px;
        }

        .price {
            font-weight: bold;
            color: #d32f2f;
        }

    </style>
</head>

<body>

<div class="container">
    <h2>🔴 Live Product Search</h2>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search product by name...">
    </div>

    <div id="message"></div>
    <div id="results"></div>
</div>

<script src="script.js"></script>

</body>
</html>
